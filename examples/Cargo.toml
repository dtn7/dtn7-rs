[package]
name = "examples"
version = "0.0.0"
publish = false
edition = "2024"


# If you copy one of the examples into a new project, you should be using
# [dependencies] instead, and delete the **path**.
[dev-dependencies]
bp7 = { version = "0.12.1", default-features = false }
dtn7-plus = { version = "0.9.1", default-features = false, features = [
  "client",
] }
clap = { version = "4.6.7", features = ["cargo", "derive"] }
anyhow = "1.0.104"
serde_json = "1.0.154"
serde_cbor = "0.11.2"
humantime = "2.4.0"
rand = "0.10.3"
dtn7 = { path = "../core/dtn7", default-features = false, version = "0.22.0" } # managed by release.sh
tokio = { version = "1.54.1", features = [
  "net",
  "rt-multi-thread",
  "macros",
  "time",
] }
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-serde = { version = "0.9.0", features = ["json"] }
# 0.13 dropped eventual fairness; the global locks starve without it (see tests/stats-deadlock-test.rs)
parking_lot = { version = "0.12.5", features = ["send_guard"] }
futures-util = "0.3.34"
pretty_env_logger = "0.5.0"
futures = "0.3.34"
lazy_static = "1.5.1"
tungstenite = "0.27.0"
log = "0.4.35"

[[example]]
name = "dtnping"
path = "dtnping.rs"

[[example]]
name = "dtnecho2"
path = "dtnecho2.rs"

[[example]]
name = "dtnerouting"
path = "dtnerouting.rs"

[[example]]
name = "dtnecla_connect_n"
path = "dtnecla_connect_n.rs"

[[example]]
name = "dtnecla_json_mtcp"
path = "dtnecla_json_mtcp.rs"

[[example]]
name = "dtnecla_mtcp"
path = "dtnecla_mtcp.rs"
