[package]
name = "dtn7"
version = "0.21.0"                                                                                                   # managed by release.sh
authors = ["Lars Baumgaertner <baumgaertner@cs.tu-darmstadt.de>"]
description = "Rust delay-tolerant-networking daemon and CLI tools implementing Bundle Protocol Version 7 (RFC9171)"
edition = "2021"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "network-programming"]
repository = "https://github.com/dtn7/dtn7-rs"
keywords = ["peer2peer", "dtn"]
exclude = [".vscode/", ".travis.yml"]
readme = "README.md"

[features]
default = ["store_sled", "store_sneakers"]
tracing = ["console-subscriber"]
deadlock_detection = ["parking_lot/deadlock_detection"]
store_sled = ["sled"]
store_sneakers = ["d7sneakers"]

[dependencies]
sled = { version = "0.34.7", optional = true }
bp7 = { version = "0.10.7", default-features = false }
dtn7-plus = { version = "0.7.3", default-features = false, features = [
  "client",
] }
d7sneakers = { version = "0.3.1", default-features = false, optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_cbor = "0.11.2"
serde_json = "1.0.154"
serde_bytes = "0.11.19"
url = "2.5.8"
rand = "0.10.3"
tokio = { version = "1.53.3", features = [
  "net",
  "rt-multi-thread",
  "macros",
  "time",
  "tracing",
] }
console-subscriber = { version = "0.5.0", features = [
  "parking_lot",
], optional = true }
tokio-util = { version = "0.7.20", features = ["codec"] }
tokio-tungstenite = "0.24.0"
tokio-serde = { version = "0.9.0", features = ["json"] }
futures = "0.3.34"
base64 = "0.23.1"
futures-util = "0.3.34"
pretty_env_logger = "0.5.0"
log = "0.4.34"
socket2 = "0.6.5"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["cargo", "derive"] }
config = { version = "0.15.27", default-features = false, features = ["toml"] }
lazy_static = "1.5.1"
anyhow = "1.0.104"
parking_lot = "0.12.5"
async-trait = "0.1.92"
attohttpc = { version = "0.31.0", default-features = false }
tinytemplate = "1.2.1"
humantime = "2.4.0"
tempfile = "3.27.0"
humansize = "2.1.3"
enum_dispatch = "0.3.13"
axum = { version = "0.5.17", features = ["ws"] }
http = "0.2.12"
#tower = "0.4.8"
hyper = { version = "0.14.32", features = ["client"] }
tungstenite = "0.21.0"
#measure_time = "0.7.0"
bitflags = "2.13.2"
num-derive = "0.5.1"
num-traits = "0.2.19"
thiserror = "2.0.21"
dtn7-codegen = { path = "../codegen", version = "0.1.2" }
sha1 = "0.11.0"
glob-match = "0.2.1"
tower-http = { version = "0.3.5", features = ["cors"] }
mdns-sd = "0.21.5"

[lib]
name = "dtn7"
path = "src/lib.rs"
