# n2 forwards only bundles from n1 to n3 with a valid primary block BIB, the payload
# BIB is encrypted along with the payload
[bpsec]
keys = "/etc/dtn7/keys"

[[bpsec.rule]]
name = "verify"
role = "verifier"
source = "dtn://n1/**"
destination = "dtn://n3/**"
operation = "bib"
targets = ["primary"]
key = "hmac"
on-failure = "drop"
