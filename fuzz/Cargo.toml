[package]
name = "dtn7-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2018"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
tokio-util = { version = "0.7.20", features = ["codec"] }
bytes = "1.12.1"
dtn7-plus = "0.7.3"
serde_cbor = "0.11.2"

[dependencies.dtn7]
path = "../core/dtn7"

[patch.crates-io]
# Point to master since tungstenite 0.21.x and 0.27.x are incompatible.
dtn7-plus = { git = "https://github.com/dtn7/dtn7-plus-rs.git", branch = "master" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_mtcp"
path = "fuzz_targets/fuzz_mtcp.rs"
test = false
doc = false

[[bin]]
name = "fuzz_wssenddata"
path = "fuzz_targets/fuzz_wssenddata.rs"
test = false
doc = false
