name: Publish to Docker Hub

on:
  push:
    tags:
      - "v*.*.*"
  # Retry publishing for an existing tag with the current version of this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish, e.g. v0.22.0
        required: true

permissions: {}

# Run them one after another.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: gh0st42/dtn7
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  # Builds every image on a native runner for its platform.
  build:
    name: Build ${{ matrix.variant }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    environment: docker-hub
    permissions:
      contents: read # check out the code
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, bookworm]
        arch: [amd64, arm64]
        include:
          - variant: alpine
            dockerfile: dockerfiles/Dockerfile.alpine-slim
          - variant: bookworm
            dockerfile: dockerfiles/Dockerfile.debian-bookwork-slim
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Get the commit of the tag
        id: rev
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=dtn7
            org.opencontainers.image.description=Rust implementation of a DTN daemon for the Bundle Protocol version 7
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.RELEASE_TAG }}
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export the digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combines the images of all platforms into one tagged multi-platform image.
  merge:
    name: Publish ${{ matrix.variant }}
    needs: build
    runs-on: ubuntu-latest
    environment: docker-hub
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        variant: [alpine, bookworm]
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Download the digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.variant }}-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create and push the multi-platform image
        shell: bash
        working-directory: ${{ runner.temp }}/digests
        run: |
          tags=(-t "$IMAGE:$VARIANT-$RELEASE_TAG" -t "$IMAGE:$VARIANT")
          if [ "$VARIANT" = bookworm ]; then
            tags+=(-t "$IMAGE:latest")
          fi
          # The files are named after the digests of the per-platform images.
          sources=()
          for digest in *; do
            sources+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
      - name: Inspect the image
        run: docker buildx imagetools inspect "$IMAGE:$VARIANT-$RELEASE_TAG"
