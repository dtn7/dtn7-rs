name: Continuous Deployment

on:
  push:
    tags:
      - "v*.*.*"
  # Retry a release for an existing tag with the current version of this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.22.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  GH_TOKEN: ${{ github.token }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Create or update the release
        shell: bash
        run: |
          # Drop the version heading, the release title already names it.
          tail -n +3 CHANGES.md > release-body.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-body.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Release $RELEASE_TAG" --notes-file release-body.md
          fi

  publish-github:
    name: Publish ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available runner, so the binaries do not need the latest glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Targets that cannot be built natively on the runner are built with cross.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          ${{ matrix.cross && 'cross' || 'cargo' }} build --locked --release \
            --target ${{ matrix.target }} --bins --examples
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release/examples
          mkdir -p release/bin
          cp {LICENSE*,COPYRIGHT,README.md,CHANGELOG.md} release/
          cp -r doc release/doc
          cp target/${{ matrix.target }}/release/{dtnd,dtntrigger,dtnsend,dtnrecv,dtnquery} release/bin
          cp target/${{ matrix.target }}/release/examples/{dtnping,dtnecho2} release/examples
          mv release/ dtn7-${{ env.RELEASE_VERSION }}/
      - name: Create release artifacts
        shell: bash
        run: |
          tar -czvf dtn7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz \
            dtn7-${{ env.RELEASE_VERSION }}/
          shasum -a 512 dtn7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz \
            > dtn7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz.sha512
      - name: Upload the release artifacts
        shell: bash
        run: |
          gh release upload "$RELEASE_TAG" --clobber \
            dtn7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz \
            dtn7-${{ env.RELEASE_VERSION }}-${{ matrix.target }}.tar.gz.sha512

  publish-crates-io:
    name: Publish on crates.io
    needs: publish-github
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish the crate
        run: cargo publish --locked --manifest-path core/dtn7/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
