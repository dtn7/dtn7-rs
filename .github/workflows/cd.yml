name: Continuous Deployment

on:
  push:
    tags:
      - "v*.*.*"
  # Retry a release for an existing tag with the current version of this workflow.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v0.22.0
        required: true

permissions: {}

# Run them one after another.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  create-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Generate a changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Create or update the release
        shell: bash
        run: |
          # Drop the version heading, the release title already names it.
          tail -n +3 CHANGES.md > release-body.md
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-body.md
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "Release $RELEASE_TAG" --notes-file release-body.md
          fi

  publish-github:
    name: Publish ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload the release artifacts
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest available runner, so the binaries do not need the latest glibc.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cross: true
          - os: ubuntu-latest
            target: armv7-unknown-linux-musleabihf
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      BUILD_CMD: ${{ matrix.cross && 'cross' || 'cargo' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Set the release version
        shell: bash
        run: echo "RELEASE_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      # Targets that cannot be built natively on the runner are built with cross.
      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cross
      - name: Build
        shell: bash
        run: |
          "$BUILD_CMD" build --locked --release --target "$TARGET" --bins --examples
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release/examples
          mkdir -p release/bin
          cp {LICENSE*,COPYRIGHT,README.md,CHANGELOG.md} release/
          cp -r doc release/doc
          cp "target/$TARGET"/release/{dtnd,dtntrigger,dtnsend,dtnrecv,dtnquery} release/bin
          cp "target/$TARGET"/release/examples/{dtnping,dtnecho2} release/examples
          mv release/ "dtn7-$RELEASE_VERSION/"
      - name: Create release artifacts
        shell: bash
        run: |
          archive="dtn7-$RELEASE_VERSION-$TARGET.tar.gz"
          tar -czvf "$archive" "dtn7-$RELEASE_VERSION/"
          shasum -a 512 "$archive" > "$archive.sha512"
      - name: Upload the release artifacts
        shell: bash
        run: |
          archive="dtn7-$RELEASE_VERSION-$TARGET.tar.gz"
          gh release upload "$RELEASE_TAG" --clobber "$archive" "$archive.sha512"

  publish-crates-io:
    name: Publish on crates.io
    needs: publish-github
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read # check out the code
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      # Trusted publishing needs to be configured on crates.io by the crate owner.
      - name: Publish the crate # zizmor: ignore[use-trusted-publishing]
        run: cargo publish --locked --manifest-path core/dtn7/Cargo.toml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
